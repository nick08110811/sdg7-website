  L.marker([p.lat, p.lng], {
    icon: icons[p.type] || icons["慣常式"]

  .bindTooltip(
    `
    <strong>${p.name}</strong><br>
    類型：${p.type}<br>
    裝置容量：${p.capacity}<br>
    所在地：${p.location}

      direction: "top",
      offset: [0, -8],
      opacity: 0.95,
