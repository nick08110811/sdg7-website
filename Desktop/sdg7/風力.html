<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>台灣風力發電場分布地圖</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .legend {
    background: white;
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 6px;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  .leaflet-tooltip {
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 6px;
  }
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ===============================
   SVG 圖釘 icon
================================ */
function makeIcon(color) {
  return L.divIcon({
    className: "",
    html: `
      <svg width="22" height="32" viewBox="0 0 24 36">
        <path d="M12 0C5.4 0 0 5.4 0 12
                 c0 9 12 24 12 24s12-15 12-24
                 C24 5.4 18.6 0 12 0z"
              fill="${color}" stroke="#000" stroke-width="1"/>
        <circle cx="12" cy="12" r="4" fill="#fff"/>
      </svg>
    `,
    iconSize: [22, 32],
    iconAnchor: [11, 32]
  });
}

const landIcon  = makeIcon('#27ae60'); // 陸域風力
const seaIcon   = makeIcon('#2980b9'); // 離岸風力

/* ===============================
   建立地圖
================================ */
const map = L.map('map').setView([23.8, 121], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/* ===============================
   陸域風力資料
================================ */
const landWind = [
  [25.2833,121.5833,'石門風力發電站','3.96 MW','新北市石門區'],
  [25.1256,121.3090,'林口風力發電站','6 MW','新北市林口區'],
  [25.0667,121.0833,'觀園風力發電站','30 MW','桃園市觀音區'],
  [25.0333,121.0333,'大潭風力發電站','15.1 MW','桃園市觀音區'],
  [25.1175,121.2767,'蘆竹風力發電站','7.2 MW','桃園市蘆竹區'],
  [24.7333,120.8833,'香山風力發電站','12 MW','新竹市香山區'],
  [24.3058,120.5417,'臺中港風力發電站','36 MW','臺中市清水區'],
  [24.1667,120.4333,'彰工風力發電站','62 MW','彰化縣線西鄉'],
  [23.9250,120.3158,'永興風力發電站','9.2 MW','彰化縣芳苑鄉'],
  [23.9894,120.3375,'王功風力發電站','23 MW','彰化縣芳苑鄉'],
  [23.8156,120.2631,'雲麥風力發電站','46 MW','雲林縣麥寮鄉'],
  [23.6333,120.1333,'四湖風力發電站','28 MW','雲林縣四湖鄉'],
  [21.9500,120.7333,'恆春風力發電站','4.5 MW','屏東縣恆春鎮'],
  [23.6167,119.6167,'中屯風力發電站','4.8 MW','澎湖縣白沙鄉'],
  [23.5842,119.6783,'湖西風力發電站','5.4 MW','澎湖縣湖西鄉'],
  [23.5608,119.6903,'龍門風力發電站','9 MW','澎湖縣湖西鄉'],
  [24.4811,118.4281,'金沙風力發電站','4 MW','金門縣金沙鎮'],
  [25.0333,121.1000,'觀威觀音風力發電站','43.7 MW','桃園市觀音區'],
  [25.0333,121.1000,'桃威觀屋風力發電站','4.6 MW','桃園市觀音區'],
  [24.5833,120.7167,'東鋼龍港風力發電站','11.5 MW','苗栗縣後龍鎮'],
  [24.1333,120.4667,'台泥彰濱風力發電站','7.2 MW','彰化縣線西鄉'],
  [23.9250,120.3158,'台泥彰旺風力發電站','14.4 MW','彰化縣芳苑鄉'],
  [23.9258,120.3147,'星寶彰化風力發電站','10.8 MW','彰化縣芳苑鄉']
];

/* ===============================
   離岸風力資料
================================ */
const seaWind = [
  [24.3500,120.2000,'大彰化離岸風力發電場','900 MW','彰化外海'],
  [24.7050,120.8181,'海洋離岸風力發電場','128 MW','苗栗縣竹南鎮外海'],
  [24.7161,120.7756,'海能離岸風力發電場','376 MW','苗栗縣竹南鎮外海'],
  [23.9250,120.3158,'台電離岸風力發電場','403.7 MW','彰化縣芳苑鄉外海']
];

/* ===============================
   加入陸域風力（hover 顯示）
================================ */
landWind.forEach(p => {
  L.marker([p[0], p[1]], { icon: landIcon })
    .bindTooltip(`
      <b>${p[2]}</b><br>
      類型：陸域風力<br>
      裝置容量：${p[3]}<br>
      地點：${p[4]}
    `, { direction:'top', offset:[0,-10], sticky:true })
    .addTo(map);
});

/* ===============================
   加入離岸風力
================================ */
seaWind.forEach(p => {
  L.marker([p[0], p[1]], { icon: seaIcon })
    .bindTooltip(`
      <b>${p[2]}</b><br>
      類型：離岸風力<br>
      裝置容量：${p[3]}<br>
      地點：${p[4]}
    `, { direction:'top', offset:[0,-10], sticky:true })
    .addTo(map);
});

/* ===============================
   圖例
================================ */
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <b>圖例</b><br>
    <span style="color:#27ae60">●</span> 陸域風力<br>
    <span style="color:#2980b9">●</span> 離岸風力
  `;
  return div;
};
legend.addTo(map);
</script>

</body>
</html>
