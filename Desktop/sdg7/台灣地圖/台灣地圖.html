fetch("twgeojson-master/json/twTown1982.geo.json")
.then(res=>res.json())
.then(data=>{
  console.log(data);
    L.geoJSON(data,{

        style:function(feature){
            const county = feature.properties.COUNTYNAME;
            const town = feature.properties.TOWNNAME;
            const key = county + town;
            const info = energyData[key];
            let color = "#d3d3d3"; // 無資料
            if(info){
                if(info.type.includes("離岸風電")){
                    color = "#0066ff";
                }
                else if(info.type.includes("風力發電")){
                    color = "#00cc66";
                }
                else if(info.type.includes("地面型太陽能")){
                    color = "#ffcc00";
                }
            }

            return{
                color:"#333",
                weight:1,
                fillColor:color,
                fillOpacity:0.7
            };
        },

        onEachFeature:function(feature,layer){
            console.log(feature.properties);
            const county =
            feature.properties.COUNTYNAME;

            const town =
            feature.properties.TOWNNAME;

            const key = county + town;

            // Hover
            layer.on('mouseover',function(){

                layer.setStyle({
                    fillColor:getColor(key),
                    fillOpacity:0.7
                });

                const info =
                energyData[key];

                let html =
                `<b>${key}</b><br>`;

                if(info){

                    html +=
                    `能源：${info.type.join("、")}<br>
                     容量：${info.power}`;

                }else{

                    html += "尚無資料";

                }

                layer.bindTooltip(
                    html,
                    {
                        sticky:true
                    }
                ).openTooltip();

            });

            layer.on('mouseout',function(){

                layer.setStyle({
                    fillColor:getColor(key),
                    fillOpacity:0.5
                });

            });

            // Click
            layer.on('click',function(){

                const info =
                energyData[key];

                let html =
                `<h3>${key}</h3>`;

                if(info){

                    html += `
                    <b>能源種類</b><br>
                    ${info.type.join("、")}
                    <br><br>

                    <b>發電容量</b><br>
                    ${info.power}
                    `;

                }else{

                    html += "目前尚未建立資料";
                }

                layer.bindPopup(html)
                     .openPopup();

            });

        }

    }).addTo(map);

         容量：${plant.capacity}<br>
         位置：${plant.location}`,

         <b>發電容量</b><br>${plant.capacity}<br><br>
         <b>位置</b><br>${plant.location}`
    )
    .addTo(map);
});
